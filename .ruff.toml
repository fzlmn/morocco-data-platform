line-length = 88
target-version = "py312"

# The notebook is a record of the source exploration, committed with its
# outputs so a reviewer sees the findings without running it. Linting its
# import order would mean re-running it and churning those outputs.
exclude = [
    "notebooks",
    ".venv",
    "transform/target",
    "transform/dbt_packages",
]

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[lint.per-file-ignores]
"dashboard/app.py" = ["E402"]   # sys.path is set before the imports by design
"dashboard/icons.py" = ["E501"] # generated data URIs
